<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gold Journal"><meta name="theme-color" content="#000000">
<title>Gold Journal · XAUUSD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f5f2e9;--cd:#fff;--in:#f1ede1;--tx:#1d1a12;--mu:#7a7360;--ac:#b8913f;--on:#14110a;--up:#1f8a52;--dn:#c8474a;--bd:#ddd6c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--cd:#2e2e2e;--in:#1f1f1f;--tx:#f2f2f2;--mu:#a6a6a6;--ac:#c09b52;--up:#4fa36f;--dn:#d4686a;--bd:#454545}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--cd:#2e2e2e;--in:#1f1f1f;--tx:#f2f2f2;--mu:#a6a6a6;--ac:#c09b52;--up:#4fa36f;--dn:#d4686a;--bd:#454545}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Prompt",system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.eye{letter-spacing:.2em;font-size:13px;color:var(--mu)}
h1{margin:2px 0;font-size:34px;letter-spacing:.01em}.sub{letter-spacing:.1em;font-size:13px;color:var(--mu)}.ba{letter-spacing:.08em;font-size:13px;color:var(--mu);padding-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.tabs button{padding:18px 0;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-weight:600;font-size:15px}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:14px}
h2{margin:0 0 14px;font-size:22px}.mu{color:var(--mu)}.s{font-size:14px;color:var(--mu)}
label{display:block;font-size:14px;color:var(--mu);margin-top:12px}
input,select,textarea{width:100%;margin-top:6px;padding:15px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:80px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.m{padding:0 6px}.m b{font-size:30px;display:block}.t3{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px}.t3 b{font-size:30px;display:block}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it{padding:14px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.gold{width:100%;padding:18px;border-radius:16px;border:0;background:var(--ac);color:var(--on);font:inherit;font-weight:700;font-size:17px;margin:4px 0 14px}
.btn{padding:12px 18px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}.btn.r{color:var(--dn)}
.bar{height:14px;border-radius:9px;background:var(--in);margin:14px 0 10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.ck{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--bd);align-items:flex-start;color:var(--tx);margin:0;font-size:16px}.ck:last-child{border:0}
.ck input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--ac)}.ck b{display:block}.ck span{font-size:14px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.seg button{padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-weight:700}
.seg .b.on{background:var(--up);color:#fff;border:0}.seg .s.on{background:var(--dn);color:#fff;border:0}
.im{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.im img,.ph img{width:100%;border-radius:12px;margin-top:6px}
.pv{margin-top:14px;padding:12px;border:1px dashed var(--bd);border-radius:12px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none}
.foot{text-align:center;font-size:13px;color:var(--mu);margin:8px 0}
</style></head><body><main>
<div class="top"><div><div class="eye">TRADE WITH DISCIPLINE</div><h1>🥇 GOLD JOURNAL</h1><div class="sub">XAUUSD · V1.1 CHART JOURNAL</div></div><div class="ba">BEFORE / AFTER</div></div>
<div class="tabs"><button data-v="dash">ภาพรวม</button><button data-v="add">+ บันทึก</button><button data-v="hist">ประวัติ</button><button data-v="stat">สถิติ</button></div>
<div id="m"></div></main><div id="toast"></div>
<script>
(function(){const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,192,192);const g=x.createLinearGradient(0,92,0,136);g.addColorStop(0,'#e9bd4a');g.addColorStop(1,'#a87a1f');x.fillStyle='#fbe7a1';x.beginPath();x.moveTo(62,56);x.lineTo(130,56);x.lineTo(154,92);x.lineTo(38,92);x.closePath();x.fill();x.fillStyle=g;x.fillRect(38,92,116,44);x.fillStyle='#6b4a10';x.font='bold 20px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('999.9',96,115);x.fillStyle='rgba(255,255,255,.35)';x.fillRect(38,92,116,3);const u=c.toDataURL('image/png');const l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.append(l);try{const b=new Blob([JSON.stringify({name:'Gold Journal',short_name:'Gold',start_url:location.href,display:'standalone',background_color:'#000000',theme_color:'#000000',icons:[{src:u,sizes:'192x192',type:'image/png'}]})],{type:'application/manifest+json'});const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(b);document.head.append(k)}catch(e){}})();

const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CL=[['วิเคราะห์ Trend แล้ว','ตรวจสอบทิศทาง H1 / M15 และ Market Structure'],['พบ Liquidity Sweep','มีการกวาด High / Low หรือ Liquidity ที่ชัดเจน'],['มี MSS / CHoCH ยืนยัน','มีการเปลี่ยนโครงสร้างราคาในทิศทางที่ต้องการ'],['ราคาอยู่ใน POI / QML','ตำแหน่งเข้าเหมาะสม ไม่ไล่ราคากลางทาง'],['มี OB / FVG สนับสนุน','มีโซนรองรับการเข้าออเดอร์'],['Risk : Reward อย่างน้อย 1:2','ตรวจสอบจุด Entry, SL และ TP'],['ควบคุมความเสี่ยงแล้ว','Lot เหมาะสม ไม่เสี่ยงเกินแผน'],['สภาพจิตใจพร้อม','ไม่ FOMO ไม่แก้มือ ไม่เทรดตามอารมณ์']];
const SETUPS=['Order Block','FVG','QML','Liquidity Sweep','อื่น ๆ'],TFS=['M1','M5','M15','M30','H1','H4'],MINDS=['มั่นใจ','มีวินัย','ลังเล','FOMO','แก้มือ'];
let db=null,mem=[],S={v:'dash',id:null,dir:'buy',imgs:{b:'',a:''},rate:34.04,cap:0,T:[],arm:null};
try{S.rate=+localStorage.getItem('rate')||34.04;S.cap=+localStorage.getItem('cap')||0}catch(e){}
const keep=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('goldj',1);q.onupgradeneeded=()=>q.result.createObjectStore('t',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
const st=m=>db.transaction('t',m).objectStore('t');
const all=()=>db?new Promise(r=>{const q=st('readonly').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}):Promise.resolve(mem);
const put=t=>db?new Promise(r=>{const q=st('readwrite').put(t);q.onsuccess=q.onerror=()=>r()}):(mem=mem.filter(x=>x.id!==t.id).concat(t),Promise.resolve());
const del=id=>db?new Promise(r=>{const q=st('readwrite').delete(id);q.onsuccess=q.onerror=()=>r()}):(mem=mem.filter(x=>x.id!==id),Promise.resolve());
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const D=n=>'$'+n.toFixed(2),cls=n=>n>=0?'up':'dn';
const nowL=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const pl=t=>t.exit==null?null:(t.exit-t.entry)*(t.dir==='buy'?1:-1)*t.lots*100;
const closed=()=>S.T.filter(t=>pl(t)!=null).sort((a,b)=>a.dt<b.dt?-1:1);
function go(v){S.v=v;S.arm=null;render();scrollTo(0,0)}
function newT(){S.id=null;S.dir='buy';S.imgs={b:'',a:''};go('add')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>b.dataset.v==='add'?newT():go(b.dataset.v));
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.v));$('#m').innerHTML={dash,add:()=>form(S.T.find(t=>t.id===S.id)),hist,stat}[S.v]();if(S.v==='add')pv()}
const foot='<div class=foot>ข้อมูลส่วนตัว · สำรองข้อมูลเป็นประจำ</div>';
const row=t=>{const p=pl(t);return`<div class=row><span>${t.dt.slice(0,10)} · ${t.dir.toUpperCase()} · ${esc(t.setup)}</span>${p==null?'<span class=mu>เปิดอยู่</span>':`<b class=${cls(p)}>${D(p)}</b>`}</div>`};

function dash(){const C=closed(),net=C.reduce((a,t)=>a+pl(t),0),w=C.filter(t=>pl(t)>0).length,l=C.length-w;
return`<div class=card><h2>ภาพรวมพอร์ต</h2><label>ทุนเริ่มต้น USD<input inputmode=decimal value="${S.cap||''}" onchange="S.cap=+this.value||0;keep('cap',S.cap);render()"></label>
<div class=g><div class=m><span class=mu>กำไรสะสม USD</span><b class=${cls(net)}>${D(net)}</b></div><div class=m><span class=mu>ยอดพอร์ต USD</span><b>${D(S.cap+net)}</b></div>
<div class=m><span class=mu>กำไรสะสม THB</span><b>฿${(net*S.rate).toFixed(2)}</b></div><div class=m><span class=mu>Win Rate</span><b>${C.length?(w/C.length*100).toFixed(1):'0.0'}%</b></div></div>
<label>อัตรา USD → THB<input inputmode=decimal value="${S.rate}" onchange="S.rate=+this.value||34.04;keep('rate',S.rate);render()"></label></div>
<div class=g3><div class=t3><span class=mu>จำนวนไม้</span><b>${C.length}</b></div><div class=t3><span class=mu>Win</span><b class=up>${w}</b></div><div class=t3><span class=mu>Loss</span><b class=dn>${l}</b></div></div>
<div class=card><h2>รายการล่าสุด</h2>${[...S.T].sort((a,b)=>a.dt<b.dt?1:-1).slice(0,5).map(t=>`<div class=it>${row(t)}</div>`).join('')||'<div class=mu>ยังไม่มีออเดอร์</div>'}</div>
<button class=gold onclick="newT()">+ บันทึกออเดอร์ใหม่</button>${foot}`}

function form(t){t=t||{};const c=t.ck||{},v=k=>t[k]==null?'':t[k],o=(a,x)=>a.map(i=>`<option ${i===x?'selected':''}>${i}</option>`).join('');
return`<div class=card oninput="pv()"><h2>${t.id?'แก้ไขออเดอร์':'1. PRE-TRADE CHECKLIST'}</h2><div class=s>ติ๊กทุกข้อที่ตรวจสอบแล้วก่อนเปิดออเดอร์</div>
<div class=row style="margin-top:18px"><b style="font-size:19px">คะแนนความพร้อม</b><b style="font-size:26px" id=sc></b></div><div class=bar><i id=bf></i></div><div class=mu id=sm></div>
<div style="margin-top:10px">${CL.map((x,i)=>`<label class=ck><input type=checkbox data-k="${i}" ${c[i]?'checked':''}><div><b>${i+1}. ${x[0]}</b><span>${x[1]}</span></div></label>`).join('')}</div></div>
<div class=card oninput="pv()"><h2>2. ข้อมูลออเดอร์</h2><label>วันเวลา<input id=dt type=datetime-local value="${t.dt||nowL()}"></label>
<div class=seg><button id=bb class="b ${S.dir==='buy'?'on':''}" onclick="sd('buy')">BUY</button><button id=bs class="s ${S.dir==='sell'?'on':''}" onclick="sd('sell')">SELL</button></div>
<label>Setup<select id=su>${o(SETUPS,t.setup)}</select></label><div class=g style="margin-top:0"><label>Timeframe<select id=tf>${o(TFS,t.tf||'M15')}</select></label><label>สภาพจิตใจ<select id=md>${o(MINDS,t.mind)}</select></label>
<label>Lot<input id=lt inputmode=decimal value="${v('lots')}"></label><label>Entry<input id=en inputmode=decimal value="${v('entry')}"></label>
<label>SL<input id=sl inputmode=decimal value="${v('sl')}"></label><label>TP<input id=tp inputmode=decimal value="${v('tp')}"></label></div>
<label>Exit (เว้นว่างถ้ายังไม่ปิด)<input id=ex inputmode=decimal value="${v('exit')}"></label><div class=pv id=pv></div></div>
<div class=card><h2>3. ภาพ BEFORE / AFTER</h2><label>ภาพก่อนเข้า<input type=file accept="image/*" onchange="pick(this,'b')"></label><div class=ph id=pb>${S.imgs.b?`<img src="${S.imgs.b}">`:''}</div>
<label>ภาพหลังปิด<input type=file accept="image/*" onchange="pick(this,'a')"></label><div class=ph id=pa>${S.imgs.a?`<img src="${S.imgs.a}">`:''}</div>
<label>โน้ต<textarea id=nt>${esc(t.note)}</textarea></label></div>
<button class=gold onclick="save()">บันทึกออเดอร์</button><div class=foot>คะแนนเป็นเครื่องมือช่วยรักษาวินัย ไม่ใช่การรับประกันว่าราคาจะเป็นไปตามคาด</div>`}
function sd(d){S.dir=d;$('#bb').classList.toggle('on',d==='buy');$('#bs').classList.toggle('on',d==='sell');pv()}
function pv(){const n=i=>{const e=$('#'+i);return e&&e.value!==''?+e.value:null},lt=n('lt'),en=n('en'),sl=n('sl'),tp=n('tp'),ex=n('ex'),h=[];
if(lt&&en!=null&&ex!=null){const p=pl({dir:S.dir,lots:lt,entry:en,exit:ex});h.push(`P/L <b class=${cls(p)}>${D(p)} · ฿${(p*S.rate).toFixed(2)}</b>`)}
if(en!=null&&sl!=null&&tp!=null&&en!==sl)h.push('RR 1:'+(Math.abs(tp-en)/Math.abs(en-sl)).toFixed(2));
if(lt&&en!=null&&sl!=null)h.push('เสี่ยง ≈ '+D(Math.abs(en-sl)*lt*100));
const e=$('#pv');if(e)e.innerHTML=h.join(' · ')||'<span class=mu>กรอก Lot / Entry / Exit เพื่อดู P/L และ RR</span>';
const k=document.querySelectorAll('[data-k]:checked').length;if($('#sc')){$('#sc').textContent=k+' / 8';$('#bf').style.width=k/8*100+'%';$('#sm').textContent=k===8?'พร้อมเข้าเทรด':k>=6?'เกือบครบ ตรวจอีกนิด':'ตรวจสอบให้ครบก่อนเข้าเทรด'}}
function pick(inp,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.imgs[k]=c.toDataURL('image/jpeg',.65);$('#p'+k).innerHTML='<img src="'+S.imgs[k]+'">'};i.src=r.result};r.readAsDataURL(f)}
async function save(){const g=i=>$('#'+i).value,n=i=>g(i)===''?null:+g(i);
if(n('en')==null||!n('lt')){toast('กรอก Lot และราคา Entry');return}
const ck={};document.querySelectorAll('[data-k]:checked').forEach(x=>ck[x.dataset.k]=1);
await put({id:S.id||Date.now().toString(36),dt:g('dt'),dir:S.dir,setup:g('su'),tf:g('tf'),mind:g('md'),lots:n('lt'),entry:n('en'),sl:n('sl'),tp:n('tp'),exit:n('ex'),note:g('nt'),ck,img:S.imgs});
S.T=await all();S.id=null;toast('บันทึกแล้ว');go('hist')}

function hist(){const im=(s,l)=>s?`<img src="${s}">`:`<span class=mu>ไม่มี${l}</span>`;
return`<div class=card><h2>ประวัติการเทรด</h2>${[...S.T].sort((a,b)=>a.dt<b.dt?1:-1).map(t=>`<div class=it>${row(t)}
<div class=mu style="margin:8px 0">Entry ${t.entry} → ${t.exit!=null?'Exit '+t.exit:'ยังเปิดอยู่'} · ${t.lots} lot · ${t.tf} · ${esc(t.mind)} · ✓${Object.keys(t.ck||{}).length}/8</div>
<div class=im>${im((t.img||{}).b,'ภาพก่อนเข้า')}${im((t.img||{}).a,'ภาพหลังปิด')}</div>${t.note?`<p>${esc(t.note)}</p>`:''}
<div style="display:flex;gap:10px;margin-top:10px"><button class=btn onclick="ed('${t.id}')">แก้ไข</button><button class="btn r" id="d${t.id}" onclick="rm('${t.id}')">ลบรายการ</button></div></div>`).join('')||'<div class=mu>ยังไม่มีออเดอร์</div>'}</div>${foot}`}
function ed(id){const t=S.T.find(x=>x.id===id);S.id=id;S.dir=t.dir;S.imgs=Object.assign({b:'',a:''},t.img);go('add')}
async function rm(id){if(S.arm!==id){S.arm=id;$('#d'+id).textContent='แตะอีกครั้งเพื่อลบ';return}await del(id);S.T=await all();go('hist')}

function stat(){const C=closed(),W=C.map(pl).filter(p=>p>0),L=C.map(pl).filter(p=>p<=0),sw=W.reduce((a,b)=>a+b,0),sl=L.reduce((a,b)=>a+b,0),by={};
C.forEach(t=>by[t.setup]=(by[t.setup]||0)+pl(t));
return`<div class=card><h2>สถิติการเทรด</h2><div class=g><div class=m><span class=mu>กำไรรวม</span><b class=up>${D(sw)}</b></div><div class=m><span class=mu>ขาดทุนรวม</span><b class=dn>${D(sl)}</b></div>
<div class=m><span class=mu>กำไรเฉลี่ย</span><b>${D(C.length?(sw+sl)/C.length:0)}</b></div><div class=m><span class=mu>Profit Factor</span><b>${sl?(sw/-sl).toFixed(2):sw?'∞':'0.00'}</b></div></div>
<h2 style="margin-top:26px">ผลแยกตาม Setup</h2>${Object.entries(by).map(([k,v])=>`<div class=it><div class=row><span class=mu style="font-size:19px">${esc(k)}</span><b class=${cls(v)}>${D(v)}</b></div></div>`).join('')||'<div class=mu>ยังไม่มีข้อมูล</div>'}</div>
<div class=card><h2>สำรอง / กู้คืนข้อมูล</h2><button class=btn onclick="bk()">สร้างข้อมูลสำรอง (คัดลอก + ดาวน์โหลด)</button>
<label>เลือกไฟล์สำรอง<input type=file accept=".json,application/json" onchange="rf(this)"></label><label>หรือวาง JSON ที่นี่<textarea id=bt></textarea></label><button class=gold style="margin-top:14px" onclick="rs()">กู้คืน (รวมกับข้อมูลเดิม)</button></div>${foot}`}
async function bk(){const s=JSON.stringify({v:2,rate:S.rate,cap:S.cap,trades:S.T}),a=$('#bt');a.value=s;
